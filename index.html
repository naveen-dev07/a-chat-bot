<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumi AI: Your Digital Aurora</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="favicon.svg">
<style>
  @keyframes moonPulse {
    0%   { filter: drop-shadow(0 0 4px #c9b8e8); }
    50%  { filter: drop-shadow(0 0 18px #8ECAE6) drop-shadow(0 0 30px #c9b8e8); }
    100% { filter: drop-shadow(0 0 4px #c9b8e8); }
  }
  .sun-icon {
    animation: sun-spin 8s linear infinite;
    transform-origin: center;
  }
  @keyframes sun-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes introLogo {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" style="height:70px;width:auto;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;animation:introLogo 1s ease 0.5s forwards;">
    <defs>
      <radialGradient id="moonGlow2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#c9b8e8"/>
        <stop offset="100%" stop-color="#8ECAE6"/>
      </radialGradient>
      <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7B5EA7"/>
        <stop offset="50%" stop-color="#9A8CBB"/>
        <stop offset="100%" stop-color="#8ECAE6"/>
      </linearGradient>
      <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <mask id="crescentMask2">
        <circle cx="50" cy="50" r="22" fill="white"/>
        <circle cx="63" cy="43" r="16" fill="black"/>
      </mask>
    </defs>
    <circle cx="50" cy="50" r="36" fill="url(#moonGlow2)" opacity="0.12"/>
    <circle cx="50" cy="50" r="22" fill="url(#moonGlow2)" mask="url(#crescentMask2)"
      style="animation: moonPulse 2s ease-in-out infinite;"/>
    <circle cx="80" cy="26" r="2.5" fill="#FFDAB9" opacity="0.9"/>
    <circle cx="74" cy="18" r="1.5" fill="#8ECAE6" opacity="0.8"/>
    <circle cx="87" cy="38" r="1.5" fill="#c9b8e8" opacity="0.8"/>
    <text x="105" y="68" font-family="'Great Vibes', cursive" font-size="68" fill="url(#textGrad2)" filter="url(#glow2)">Lumi</text>
  </svg>
  <div class="intro-overlay"></div>
</div>

<!-- APP -->
<div id="app">
<div class="mesh-background">

  <header>
    <div class="logo-wrap">
      <div class="logo-svg-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" style="height:60px;width:auto;">
          <defs>
            <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#c9b8e8"/>
              <stop offset="100%" stop-color="#8ECAE6"/>
            </radialGradient>
            <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7B5EA7"/>
              <stop offset="50%" stop-color="#9A8CBB"/>
              <stop offset="100%" stop-color="#8ECAE6"/>
            </linearGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9A8CBB" flood-opacity="0.3"/>
            </filter>
            <mask id="crescentMask">
              <circle cx="50" cy="50" r="22" fill="white"/>
              <circle cx="63" cy="43" r="16" fill="black"/>
            </mask>
          </defs>
          <circle cx="50" cy="50" r="36" fill="url(#moonGlow)" opacity="0.12"/>
          <circle cx="50" cy="50" r="22" fill="url(#moonGlow)" mask="url(#crescentMask)" filter="url(#glow)"/>
          <circle cx="80" cy="26" r="2.5" fill="#FFDAB9" opacity="0.9"/>
          <circle cx="74" cy="18" r="1.5" fill="#8ECAE6" opacity="0.8"/>
          <circle cx="87" cy="38" r="1.5" fill="#c9b8e8" opacity="0.8"/>
          <text x="105" y="68" font-family="'Great Vibes', cursive" font-size="84" fill="url(#textGrad)" filter="url(#softShadow)">Lumi</text>
        </svg>
      </div>
      <p class="tagline">Illuminating every conversation</p>
    </div>

    <div class="header-controls">
      <button class="glass-icon" id="btn-new" title="New Chat">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/>
        </svg>
      </button>
      <button class="glass-icon" title="Menu">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="glass-icon" title="Audio">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 10v3"/><path d="M6 6v11"/>
          <path d="M10 3v18"/><path d="M14 8v7"/>
          <path d="M18 5v13"/><path d="M22 10v3"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div class="ribbon-card">
      <div class="card-inner">
        <div class="messages" id="messages"></div>
        <div class="input-bar">
          <!-- CHANGED: input → textarea for text wrapping -->
          <textarea id="msgInput" placeholder="Message..." autocomplete="off" rows="1"></textarea>
          <button class="action-btn" id="actionBtn">
            <svg id="micIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="11" rx="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
            <svg id="sendIcon" style="display:none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>
</div>

<script src="app.js"></script>
</body>
</html>
