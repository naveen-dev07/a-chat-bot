<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lumiDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a; stop-opacity:1" /> <stop offset="100%" style="stop-color:#3b82f6; stop-opacity:1" /> </linearGradient>
    
    <filter id="crescentGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M50 15 A35 35 0 1 0 85 50 A30 30 0 1 1 50 15" 
